name: Fetch & Analyze News

on:
  schedule:
    - cron: '0 * * * *'    # Every hour at :00 UTC (= every hour at 5:30 IST)
  workflow_dispatch:         # Also triggerable manually from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # Cache the ~90MB SentenceTransformer model so it is not re-downloaded every hour
      - name: Cache SentenceTransformer model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-st-all-MiniLM-L6-v2

      - name: Download SentenceTransformer model
        run: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"

      # ── REQUIRED SECRETS (set in GitHub Repo → Settings → Secrets) ──────────
      # GROQ_API_KEY : Free key from https://console.groq.com
      # DATABASE_URL : PostgreSQL connection string, e.g. from Supabase free tier
      #                Format: postgresql+psycopg://user:password@host:5432/dbname
      # ─────────────────────────────────────────────────────────────────────────
      - name: Run news pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL:  ${{ secrets.DATABASE_URL }}
        run: python -m backend.pipeline.run

      - name: Report pipeline results
        if: always()
        run: |
          echo "================================================"
          echo "Pipeline finished with status: ${{ job.status }}"
          echo "Triggered at: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "================================================"
